<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enter Verification Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .icon svg { width: 32px; height: 32px; fill: #fff; }

    h1 {
      font-size: 1.5rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .phone-display {
      display: inline-block;
      background: #f0fdf4;
      color: #16a34a;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 28px;
    }

    .otp-wrapper {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .otp-wrapper input {
      width: 52px;
      height: 58px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      color: #111827;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: #25D366;
    }

    .otp-wrapper input:focus {
      border-color: #25D366;
      box-shadow: 0 0 0 3px rgba(37,211,102,0.15);
    }

    .otp-wrapper input.filled {
      border-color: #25D366;
      background: #f0fdf4;
    }

    .otp-wrapper input.error-box {
      border-color: #ef4444;
      background: #fef2f2;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-bottom: 12px;
      min-height: 20px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 16px;
    }

    .btn:hover:not(:disabled) { background: #1ebe5a; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { background: #a7f3c4; cursor: not-allowed; }

    .resend-row {
      font-size: 0.85rem;
      color: #6b7280;
    }

    .resend-row a {
      color: #25D366;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .resend-row a:hover { text-decoration: underline; }

    .success-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .success-overlay .check {
      width: 72px;
      height: 72px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-overlay .check svg {
      width: 40px;
      height: 40px;
      stroke: #fff;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success-overlay h2 { color: #16a34a; font-size: 1.3rem; }
    .success-overlay p  { color: #6b7280; font-size: 0.9rem; }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">

  <!-- Verify Form -->
  <div id="form-section">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    </div>

    <h1>Enter the Code</h1>
    <p class="subtitle">We sent a 5-digit code to your WhatsApp number</p>
    <span class="phone-display" id="phone-label">+—</span>

    <div class="otp-wrapper" id="otp-inputs">
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" />
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" />
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" />
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" />
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" />
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="btn" id="verify-btn" onclick="verifyCode()">Verify</button>

    <div class="resend-row">
      Didn't receive it? <a onclick="resendCode()">Resend code</a>
    </div>
  </div>

  <!-- Success State -->
  <div class="success-overlay" id="success-section">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2>Verified!</h2>
    <p>Your WhatsApp number has been confirmed.</p>
  </div>

</div>

<script>
  const WA_API_URL = 'https://graph.facebook.com/v25.0/1156326287566495/messages';
  const WA_TOKEN   = 'EAAg3wrzjaZAkBRxtZA66rZBZCw2vUGIzIy2w7f65txVJi6aEZBxdpQxs6EWg61aspZBiHrgC9YB3ambylGkDtQQZAqZCIeH6mYejtyjfhgjklsiigwutiufgiuIUOGUIOUTR7SDIBUYFURLeDgZDZD';

  const storedCode  = sessionStorage.getItem('wa_code');
  const storedPhone = sessionStorage.getItem('wa_phone');

  if (!storedCode || !storedPhone) {
    window.location.href = 'index.html';
  }

  const label = document.getElementById('phone-label');
  if (storedPhone) {
    const p = storedPhone;
    label.textContent = '+' + p.slice(0, 2) + '****' + p.slice(-3);
  }

  const inputs = Array.from(document.querySelectorAll('#otp-inputs input'));

  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '');
      if (inp.value) {
        inp.classList.add('filled');
        inp.classList.remove('error-box');
        if (i < inputs.length - 1) inputs[i + 1].focus();
      } else {
        inp.classList.remove('filled');
      }
    });

    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && i > 0) {
        inputs[i - 1].focus();
        inputs[i - 1].value = '';
        inputs[i - 1].classList.remove('filled');
      }
      if (e.key === 'Enter') verifyCode();
    });

    inp.addEventListener('paste', e => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 5);
      pasted.split('').forEach((ch, idx) => {
        if (inputs[idx]) {
          inputs[idx].value = ch;
          inputs[idx].classList.add('filled');
        }
      });
      inputs[Math.min(pasted.length, inputs.length - 1)].focus();
    });
  });

  inputs[0].focus();

  function getEnteredCode() {
    return inputs.map(i => i.value).join('');
  }

  function showError(msg) {
    document.getElementById('error-msg').style.color = '#ef4444';
    document.getElementById('error-msg').textContent = msg;
    inputs.forEach(i => i.classList.add('error-box'));
  }

  function clearError() {
    document.getElementById('error-msg').textContent = '';
    inputs.forEach(i => i.classList.remove('error-box'));
  }

  function verifyCode() {
    clearError();
    const entered = getEnteredCode();

    if (entered.length < 5) {
      showError('Please enter all 5 digits.');
      return;
    }

    if (entered === storedCode) {
      sessionStorage.removeItem('wa_code');
      sessionStorage.removeItem('wa_phone');
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'flex';
      // Redirect after success if needed:
      // setTimeout(() => window.location.href = 'dashboard.html', 2000);
    } else {
      showError('Incorrect code. Please try again.');
    }
  }

  function generateCode() {
    return String(Math.floor(10000 + Math.random() * 90000));
  }

  async function resendCode() {
    clearError();
    const newCode = generateCode();

    const body = {
      messaging_product: 'whatsapp',
      to: storedPhone,
      type: 'template',
      template: {
        name: 'bittoken_verify',
        language: { code: 'en_US' },
        components: [
          {
            type: 'body',
            parameters: [{ type: 'text', text: newCode }]
          },
          {
            type: 'button',
            sub_type: 'url',
            index: '0',
            parameters: [{ type: 'text', text: newCode }]
          }
        ]
      }
    };

    try {
      const res = await fetch(WA_API_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + WA_TOKEN,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        sessionStorage.setItem('wa_code', newCode);
        inputs.forEach(i => { i.value = ''; i.classList.remove('filled', 'error-box'); });
        inputs[0].focus();
        const msgEl = document.getElementById('error-msg');
        msgEl.style.color = '#16a34a';
        msgEl.textContent = 'New code sent!';
        setTimeout(() => { msgEl.style.color = '#ef4444'; msgEl.textContent = ''; }, 3000);
      } else {
        showError('Failed to resend. Try again.');
      }
    } catch {
      showError('Network error. Please try again.');
    }
  }
</script>

</body>
</html>
